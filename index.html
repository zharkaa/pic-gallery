<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="text-scale" content="scale" />
    <!-- FOUC guard: mirror ThemeProvider's resolution before the bundle loads.
         Keep in sync with `theme-provider.tsx` (storage key + default theme). -->
    <script>
      try {
        var stored = localStorage.getItem("vite-ui-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.querySelector('meta[name="color-scheme"]').content = dark ? "dark" : "light";
      } catch (error) {}
    </script>
    <title>pic-gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
